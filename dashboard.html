<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen — Admin Dashboard</title>

<!-- Tailwind Play CDN: enable class-based dark mode BEFORE loading the script's styles -->
<script>tailwind = { config: { darkMode: 'class' } }</script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Reusable component classes (Tailwind @apply) -->
<style type="text/tailwindcss">
  @layer components {
    .card { @apply rounded-2xl border border-black/5 bg-white shadow-[0_1px_2px_rgba(0,0,0,.04),0_12px_28px_-16px_rgba(0,0,0,.12)] dark:border-white/10 dark:bg-[#141417] dark:shadow-none; }
    .inp  { @apply w-full rounded-xl border border-black/10 bg-zinc-50 px-3.5 py-2.5 text-sm text-zinc-900 outline-none transition placeholder:text-zinc-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/15 dark:border-white/10 dark:bg-white/5 dark:text-white; }
    .btn  { @apply inline-flex items-center justify-center gap-2 rounded-xl bg-blue-600 px-4 py-2.5 text-sm font-medium text-white shadow-sm transition hover:bg-blue-500 active:scale-[.98]; }
    .icon-btn { @apply grid h-10 w-10 place-items-center rounded-xl text-zinc-500 transition hover:bg-black/5 hover:text-zinc-900 dark:text-zinc-400 dark:hover:bg-white/10 dark:hover:text-white; }
  }
</style>
<style>
  body { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
  /* Sidebar widths: expanded vs collapsed (desktop) */
  #sidebar { width: 16rem; transition: width .25s ease, transform .25s ease; }
  #sidebar.collapsed { width: 76px; }
  #sidebar.collapsed .lbl { display: none; }
  #sidebar.collapsed .nav-link { justify-content: center; }
  .bar { transition: height .5s cubic-bezier(.2,.8,.2,1); }
  :focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<body class="bg-[#f5f5f7] text-zinc-900 antialiased dark:bg-[#0a0a0c] dark:text-zinc-100">
<div class="flex min-h-screen">

  <!-- Mobile overlay -->
  <div id="overlay" class="fixed inset-0 z-30 hidden bg-black/40 backdrop-blur-sm lg:hidden"></div>

  <!-- ============ SIDEBAR ============ -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 flex -translate-x-full flex-col border-r border-black/5 bg-white/80 p-3 backdrop-blur-xl dark:border-white/10 dark:bg-[#101013]/90 lg:sticky lg:top-0 lg:h-screen lg:translate-x-0">
    <a href="#" class="mb-6 flex items-center gap-3 px-2 pt-2">
      <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 text-white shadow-lg shadow-blue-500/30">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </span>
      <span class="lbl text-lg font-semibold tracking-tight">Lumen</span>
    </a>
    <nav id="nav" class="flex flex-1 flex-col gap-1" aria-label="Sidebar"></nav>

    <!-- Plan card (hidden when collapsed) -->
    <div class="lbl card mt-4 p-4">
      <p class="text-sm font-medium">Pro plan</p>
      <p class="mt-0.5 text-xs text-zinc-500">72% of API quota used</p>
      <div class="mt-3 h-1.5 overflow-hidden rounded-full bg-zinc-200 dark:bg-white/10"><div class="h-full w-[72%] rounded-full bg-blue-600"></div></div>
    </div>
  </aside>

  <!-- ============ MAIN COLUMN ============ -->
  <div class="min-w-0 flex-1">

    <!-- TOP BAR -->
    <header class="sticky top-0 z-20 flex items-center gap-3 border-b border-black/5 bg-[#f5f5f7]/80 px-4 py-3 backdrop-blur-xl dark:border-white/10 dark:bg-[#0a0a0c]/80 sm:px-6">
      <button id="toggle" class="icon-btn" aria-label="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>

      <!-- CMD+K search -->
      <div class="relative hidden max-w-md flex-1 sm:block">
        <svg class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-400" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" class="inp pl-10 pr-16" placeholder="Search anything…" aria-label="Search">
        <kbd id="kbd" class="absolute right-3 top-1/2 -translate-y-1/2 rounded-md border border-black/10 bg-white px-1.5 py-0.5 text-[11px] font-medium text-zinc-500 dark:border-white/10 dark:bg-white/5">⌘K</kbd>
      </div>

      <div class="ml-auto flex items-center gap-1.5 sm:gap-2">
        <button id="theme" class="icon-btn" aria-label="Toggle theme"></button>
        <button class="icon-btn relative" aria-label="Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 6 2 7 2 7H4s2-1 2-7z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
          <span class="absolute right-2.5 top-2.5 h-2 w-2 rounded-full bg-red-500 ring-2 ring-[#f5f5f7] dark:ring-[#0a0a0c]"></span>
        </button>
        <button id="quick" class="btn hidden sm:inline-flex">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Create New Prompt
        </button>
        <span class="grid h-9 w-9 place-items-center rounded-full bg-gradient-to-br from-pink-400 to-orange-400 text-sm font-semibold text-white" title="Alex Morgan">AM</span>
      </div>
    </header>

    <main class="mx-auto max-w-7xl space-y-6 p-4 sm:p-6">
      <div>
        <h1 class="text-2xl font-semibold tracking-tight">Good morning, Alex</h1>
        <p class="mt-1 text-sm text-zinc-500">Here's what's happening with your product today.</p>
      </div>

      <!-- METRIC CARDS -->
      <section id="metrics" class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4" aria-label="Key metrics"></section>

      <!-- CHART + GENERATOR -->
      <section class="grid gap-6 xl:grid-cols-3">

        <!-- Analytics chart (CSS bars) -->
        <div class="card p-5 sm:p-6 xl:col-span-2">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 class="font-semibold">Analytics</h2>
              <p id="chart-sub" class="text-sm text-zinc-500"></p>
            </div>
            <div id="tabs" class="flex rounded-xl bg-zinc-100 p-1 text-sm dark:bg-white/5"></div>
          </div>
          <div class="relative mt-6 h-64">
            <!-- Grid lines -->
            <div class="absolute inset-0 flex flex-col justify-between" aria-hidden="true">
              <div class="border-t border-dashed border-black/10 dark:border-white/10"></div><div class="border-t border-dashed border-black/10 dark:border-white/10"></div>
              <div class="border-t border-dashed border-black/10 dark:border-white/10"></div><div class="border-t border-dashed border-black/10 dark:border-white/10"></div>
              <div class="border-t border-black/10 dark:border-white/10"></div>
            </div>
            <div id="bars" class="absolute inset-0 flex items-end gap-1.5 sm:gap-3"></div>
          </div>
          <div id="months" class="mt-2 flex gap-1.5 text-center text-[11px] text-zinc-400 sm:gap-3"></div>
        </div>

        <!-- AI PROMPT GENERATOR -->
        <div class="card flex flex-col p-5 sm:p-6">
          <div class="flex items-center gap-2">
            <span class="grid h-8 w-8 place-items-center rounded-lg bg-blue-600/10 text-blue-600 dark:text-blue-400">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>
            </span>
            <h2 class="font-semibold">AI Prompt Generator</h2>
          </div>
          <div class="mt-4 space-y-3">
            <div><label for="tpl" class="mb-1 block text-xs font-medium text-zinc-500">Template</label>
              <select id="tpl" class="inp">
                <option value="blog">Blog introduction</option><option value="product">Product description</option>
                <option value="email">Cold email</option><option value="thread">Social thread</option>
              </select></div>
            <div><label for="topic" class="mb-1 block text-xs font-medium text-zinc-500">Topic</label>
              <input id="topic" class="inp" placeholder="e.g. AI workflow automation" value="AI workflow automation"></div>
            <div class="grid grid-cols-2 gap-3">
              <div><label for="tone" class="mb-1 block text-xs font-medium text-zinc-500">Tone</label>
                <select id="tone" class="inp"><option>Friendly</option><option>Professional</option><option>Bold</option></select></div>
              <div><label for="aud" class="mb-1 block text-xs font-medium text-zinc-500">Audience</label>
                <input id="aud" class="inp" value="Startup founders"></div>
            </div>
            <button id="gen" class="btn w-full">Generate output</button>
          </div>
          <div class="relative mt-4 flex-1">
            <div id="out" class="min-h-[120px] whitespace-pre-wrap rounded-xl border border-black/5 bg-zinc-50 p-4 pr-14 text-sm leading-relaxed text-zinc-600 dark:border-white/10 dark:bg-white/5 dark:text-zinc-300" aria-live="polite">Your generated prompt will appear here.</div>
            <button id="copy" class="absolute right-2 top-2 rounded-lg px-2 py-1 text-xs font-medium text-zinc-500 hover:bg-black/5 dark:hover:bg-white/10">Copy</button>
          </div>
        </div>
      </section>

      <!-- RECENT ACTIVITY TABLE -->
      <section class="card overflow-hidden">
        <div class="flex items-center justify-between p-5 sm:p-6">
          <h2 class="font-semibold">Recent activity</h2>
          <a href="#" class="text-sm font-medium text-blue-600 hover:underline dark:text-blue-400">View all</a>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full min-w-[640px] text-left text-sm">
            <thead class="border-y border-black/5 bg-zinc-50/70 text-xs text-zinc-500 dark:border-white/10 dark:bg-white/[.03]">
              <tr><th class="px-6 py-3 font-medium">User</th><th class="px-3 py-3 font-medium">Status</th><th class="px-3 py-3 font-medium">Plan</th><th class="px-3 py-3 font-medium">Date</th><th class="px-6 py-3 text-right font-medium">Action</th></tr>
            </thead>
            <tbody id="rows" class="divide-y divide-black/5 dark:divide-white/10"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>

<script>
/* ---------- Helpers & data ---------- */
const $ = id => document.getElementById(id);
const ic = p => `<svg class="shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

const NAV = [
  ['Dashboard',     '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>'],
  ['AI Generators', '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 2 2 .7-2 .7L19 21l-.7-1.6-2-.7 2-.7z"/>'],
  ['API Keys',      '<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9"/><path d="m16 7 3 3"/>'],
  ['Billing',       '<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/>'],
  ['Settings',      '<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>']
];
const METRICS = [
  ['Total Users',      '48,291',  '+12.5%', true,  '<circle cx="9" cy="8" r="3.5"/><path d="M2.500 20c0-3.600 2.900-6 6.500-6s6.500 2.400 6.500 6"/><path d="M16 4.500a3.500 3.500 0 0 1 0 7M21.500 20c0-2.600-1.500-4.500-4-5.300"/>'],
  ['Monthly Revenue',  '$12,450', '+8.2%',  true,  '<path d="M12 2v20M17 6H9.500a3.500 3.500 0 0 0 0 7h5a3.500 3.500 0 0 1 0 7H6"/>'],
  ['API Requests',     '2.4M',    '+23.1%', true,  '<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>'],
  ['Success Rate',     '99.2%',   '-0.4%',  false, '<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>']
];
const CHARTS = {
  Revenue:  { sub: 'Monthly revenue, last 12 months', fmt: v => '$' + v.toLocaleString(), data: [6200,7100,6800,8300,9100,8700,10200,9800,11300,10900,11800,12450] },
  Requests: { sub: 'API requests (thousands), last 12 months', fmt: v => v + 'k', data: [820,910,1040,1180,1250,1430,1590,1720,1880,2010,2200,2400] }
};
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const USERS = [
  ['Olivia Chen','olivia@acme.io','Active','Pro','Oct 4, 2026','from-violet-400 to-fuchsia-400'],
  ['Marcus Webb','marcus@loop.dev','Pending','Hobby','Oct 4, 2026','from-sky-400 to-blue-500'],
  ['Priya Nair','priya@northwind.co','Active','Enterprise','Oct 3, 2026','from-emerald-400 to-teal-500'],
  ['Tomás Silva','tomas@pixel.app','Failed','Pro','Oct 2, 2026','from-amber-400 to-orange-500'],
  ['Hannah Fischer','hannah@orbit.ai','Active','Pro','Oct 1, 2026','from-rose-400 to-pink-500'],
  ['Kenji Sato','kenji@flux.jp','Pending','Hobby','Sep 30, 2026','from-indigo-400 to-purple-500']
];
const BADGE = {
  Active:  'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400',
  Pending: 'bg-amber-500/10 text-amber-600 dark:text-amber-400',
  Failed:  'bg-red-500/10 text-red-600 dark:text-red-400'
};

/* ---------- Sidebar: nav, active state, collapse ---------- */
$('nav').innerHTML = NAV.map(([n, p], i) => `
  <a href="#" data-i="${i}" title="${n}" class="nav-link flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium transition ${i === 0 ? 'bg-blue-600/10 text-blue-600 dark:text-blue-400' : 'text-zinc-500 hover:bg-black/5 hover:text-zinc-900 dark:hover:bg-white/10 dark:hover:text-white'}">
    ${ic(p)}<span class="lbl">${n}</span></a>`).join('');
$('nav').addEventListener('click', e => {
  const a = e.target.closest('a'); if (!a) return; e.preventDefault();
  document.querySelectorAll('.nav-link').forEach(l => {
    const on = l === a;
    l.classList.toggle('bg-blue-600/10', on); l.classList.toggle('text-blue-600', on); l.classList.toggle('dark:text-blue-400', on);
    l.classList.toggle('text-zinc-500', !on);
  });
});
const sb = $('sidebar'), ov = $('overlay');
$('toggle').addEventListener('click', () => {
  if (innerWidth >= 1024) sb.classList.toggle('collapsed');           // desktop: collapse to icons
  else { sb.classList.toggle('-translate-x-full'); ov.classList.toggle('hidden'); } // mobile: drawer
});
ov.addEventListener('click', () => { sb.classList.add('-translate-x-full'); ov.classList.add('hidden'); });

/* ---------- Theme toggle (follows system by default) ---------- */
const SUN = ic('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.900 4.900l1.400 1.400M17.700 17.700l1.400 1.400M2 12h2M20 12h2M4.900 19.100l1.400-1.400M17.700 6.300l1.400-1.400"/>');
const MOON = ic('<path d="M21 12.800A9 9 0 1 1 11.200 3a7 7 0 0 0 9.800 9.800z"/>');
function paintTheme() { $('theme').innerHTML = document.documentElement.classList.contains('dark') ? SUN : MOON; }
if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
$('theme').addEventListener('click', () => { document.documentElement.classList.toggle('dark'); paintTheme(); });
paintTheme();

/* ---------- CMD/CTRL + K focuses search ---------- */
if (!/Mac|iPhone|iPad/.test(navigator.platform)) $('kbd').textContent = 'Ctrl K';
addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('search').focus(); } });

/* ---------- Metric cards ---------- */
$('metrics').innerHTML = METRICS.map(([label, val, delta, up, p]) => `
  <article class="card p-5">
    <div class="flex items-center justify-between">
      <p class="text-sm text-zinc-500">${label}</p>
      <span class="grid h-9 w-9 place-items-center rounded-xl bg-zinc-100 text-zinc-600 dark:bg-white/5 dark:text-zinc-300">${ic(p)}</span>
    </div>
    <p class="mt-3 text-3xl font-semibold tracking-tight">${val}</p>
    <p class="mt-2 flex items-center gap-1.5 text-xs">
      <span class="inline-flex items-center gap-0.5 rounded-full px-2 py-0.5 font-medium ${up ? 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400' : 'bg-red-500/10 text-red-600 dark:text-red-400'}">${up ? '↑' : '↓'} ${delta}</span>
      <span class="text-zinc-500">vs last month</span>
    </p>
  </article>`).join('');

/* ---------- Bar chart (pure CSS bars with hover tooltips) ---------- */
let tab = 'Revenue';
function drawChart() {
  const { sub, fmt, data } = CHARTS[tab], max = Math.max(...data);
  $('chart-sub').textContent = sub;
  $('tabs').innerHTML = Object.keys(CHARTS).map(k => `<button data-k="${k}" class="rounded-lg px-3 py-1.5 font-medium transition ${k === tab ? 'bg-white shadow-sm dark:bg-white/10' : 'text-zinc-500'}">${k}</button>`).join('');
  $('bars').innerHTML = data.map((v, i) => `
    <div class="group relative flex h-full flex-1 items-end">
      <span class="pointer-events-none absolute -top-1 left-1/2 z-10 -translate-x-1/2 -translate-y-full whitespace-nowrap rounded-lg bg-zinc-900 px-2 py-1 text-xs text-white opacity-0 transition group-hover:opacity-100 dark:bg-white dark:text-zinc-900" style="bottom:${v / max * 100}%;top:auto;transform:translate(-50%,0);margin-bottom:6px;height:fit-content">${fmt(v)}</span>
      <div class="bar w-full rounded-t-lg ${i === data.length - 1 ? 'bg-blue-600' : 'bg-blue-600/25 group-hover:bg-blue-600/60'}" style="height:${v / max * 100}%"></div>
    </div>`).join('');
}
$('months').innerHTML = MONTHS.map(m => `<span class="flex-1">${m}</span>`).join('');
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { tab = b.dataset.k; drawChart(); } });
drawChart();

/* ---------- Activity table + action menu ---------- */
$('rows').innerHTML = USERS.map(([n, mail, st, plan, date, g], i) => `
  <tr class="transition hover:bg-zinc-50 dark:hover:bg-white/[.03]">
    <td class="px-6 py-3.5"><div class="flex items-center gap-3">
      <span class="grid h-9 w-9 place-items-center rounded-full bg-gradient-to-br ${g} text-xs font-semibold text-white">${n.split(' ').map(s => s[0]).join('')}</span>
      <div><p class="font-medium">${n}</p><p class="text-xs text-zinc-500">${mail}</p></div></div></td>
    <td class="px-3 py-3.5"><span class="rounded-full px-2.5 py-1 text-xs font-medium ${BADGE[st]}">${st}</span></td>
    <td class="px-3 py-3.5 text-zinc-600 dark:text-zinc-300">${plan}</td>
    <td class="px-3 py-3.5 text-zinc-500">${date}</td>
    <td class="relative px-6 py-3.5 text-right">
      <button class="menu-btn icon-btn !h-8 !w-8" data-i="${i}" aria-label="Row actions" aria-haspopup="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.600"/><circle cx="12" cy="12" r="1.600"/><circle cx="19" cy="12" r="1.600"/></svg></button>
      <div id="m${i}" class="menu card absolute right-6 top-12 z-10 hidden w-40 p-1.5 text-left text-sm shadow-xl">
        <button class="w-full rounded-lg px-3 py-2 text-left hover:bg-black/5 dark:hover:bg-white/10">View profile</button>
        <button class="w-full rounded-lg px-3 py-2 text-left hover:bg-black/5 dark:hover:bg-white/10">Send email</button>
        <button class="w-full rounded-lg px-3 py-2 text-left text-red-600 hover:bg-red-500/10">Suspend</button>
      </div>
    </td>
  </tr>`).join('');
document.addEventListener('click', e => {
  const b = e.target.closest('.menu-btn');
  document.querySelectorAll('.menu').forEach(m => { if (!b || m.id !== 'm' + b.dataset.i) m.classList.add('hidden'); });
  if (b) $('m' + b.dataset.i).classList.toggle('hidden');
});

/* ---------- AI Prompt Generator (simulated) ---------- */
const TEMPLATES = {
  blog:    (t, tone, a) => `Write a ${tone.toLowerCase()} blog introduction about "${t}" for ${a}.\n\nOpen with a surprising fact, name the main problem in one sentence, then promise 3 practical takeaways. Keep it under 120 words and end with a question that invites the reader to continue.`,
  product: (t, tone, a) => `Write a ${tone.toLowerCase()} product description for a tool built around "${t}", aimed at ${a}.\n\nLead with the single biggest benefit, list 3 features as outcomes (not specs), and finish with a one-line call to action.`,
  email:   (t, tone, a) => `Draft a ${tone.toLowerCase()} cold email to ${a} about "${t}".\n\nSubject under 6 words. Body: one line of relevance, one line of proof, one clear ask for a 15-minute call. No more than 90 words.`,
  thread:  (t, tone, a) => `Create a ${tone.toLowerCase()} 6-post social thread on "${t}" for ${a}.\n\nPost 1 is a bold hook. Posts 2-5 each give one tip with a quick example. Post 6 summarizes and asks for a follow.`
};
let typer;
$('gen').addEventListener('click', () => {
  clearInterval(typer);
  const t = $('topic').value.trim() || 'your topic', text = TEMPLATES[$('tpl').value](t, $('tone').value, $('aud').value.trim() || 'your audience');
  const out = $('out'); let i = 0; out.textContent = '';
  typer = setInterval(() => { out.textContent = text.slice(0, ++i); if (i >= text.length) clearInterval(typer); }, 12);
});
$('copy').addEventListener('click', async e => {
  try { await navigator.clipboard.writeText($('out').textContent); e.target.textContent = 'Copied'; }
  catch { e.target.textContent = 'Press Ctrl+C'; }
  setTimeout(() => e.target.textContent = 'Copy', 1500);
});
$('quick').addEventListener('click', () => { $('topic').focus(); $('topic').scrollIntoView({ behavior: 'smooth', block: 'center' }); });
</script>
</body>
